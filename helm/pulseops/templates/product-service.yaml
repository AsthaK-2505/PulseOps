apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: pulseops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: pulseops/product-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: pulseops
spec:
  selector:
    app: product-service
  ports:
    - port: 5001
      targetPort: 5001
