apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: pulseops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: pulseops/notification-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5003

          env:
            - name: RABBITMQ_HOST
              value: rabbitmq

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: 5003
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 5003
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: pulseops
spec:
  selector:
    app: notification-service
  ports:
    - port: 5003
      targetPort: 5003
