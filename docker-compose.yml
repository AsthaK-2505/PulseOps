services:

  api-gateway:
    build: ./services/api-gateway
    ports:
      - "5000:5000"
    environment:
      PRODUCT_SERVICE_URL: http://product-service:5001
      ORDER_SERVICE_URL: http://order-service:5002
    depends_on:
      - product-service
      - order-service

  product-service:
    build: ./services/product-service
    expose:
      - "5001"

  order-service:
    build: ./services/order-service
    expose:
      - "5002"
    depends_on:
      - postgres
      - rabbitmq

  notification-service:
    build: ./services/notification-service
    expose:
      - "5003"
    depends_on:
      - rabbitmq

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pulseops
      POSTGRES_USER: pulseops
      POSTGRES_PASSWORD: pulseops-password
    volumes:
      - postgres-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "15672:15672"

volumes:
  postgres-data:
